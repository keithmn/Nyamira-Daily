name: Quality checks

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm test
      - run: python -m unittest discover -s scripts -p 'test_*.py'
      - run: npm run build
        env:
          ND_PREVIEW_BUILD: '1'
